<!doctype html>
<html lang="fr-FR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#121212" />

    <!-- Applies the saved theme before the first paint, otherwise dark-mode
         visitors see the light page flash while React boots. Mirrors
         ThemeProvider (storage key and "light" default from main.tsx). -->
    <script>
      try {
        var theme = localStorage.getItem("vite-ui-theme") || "light";
        if (theme === "system") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <title>Téo Villet - Développeur Fullstack Freelance à Grenoble</title>

    <meta name="author" content="Téo Villet" />
    <!-- data-rh lets the pages' Helmet replace this tag instead of adding a second one -->
    <meta
      data-rh="true"
      name="description"
      content="Développeur web freelance à Grenoble. Sites vitrines, applications et outils sur mesure pour restaurants, artisans et indépendants. Devis gratuit sous 24 h."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Téo Villet - Développeur Freelance à Grenoble" />
    <meta
      property="og:description"
      content="Développeur web freelance à Grenoble. Sites vitrines, applications et outils sur mesure. Devis gratuit sous 24 h."
    />
    <meta property="og:url" content="https://www.teovillet.fr/" />
    <meta property="og:image" content="https://www.teovillet.fr/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Téo Villet, développeur web freelance à Grenoble" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Téo Villet - Développeur Freelance à Grenoble" />
    <meta name="twitter:description" content="Développeur web freelance à Grenoble. Sites vitrines, applications et outils sur mesure. Devis gratuit sous 24 h." />
    <meta name="twitter:image" content="https://www.teovillet.fr/og-image.jpg" />

    <!-- Schema.org: who I am, and the freelance business Google can show
         for local searches ("développeur web Grenoble") -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://www.teovillet.fr/#person",
            "name": "Téo Villet",
            "url": "https://www.teovillet.fr",
            "image": "https://www.teovillet.fr/images/about/me.jpg",
            "jobTitle": "Développeur Web Fullstack",
            "alumniOf": "IMT Nord Europe",
            "sameAs": ["https://www.linkedin.com/in/teo-villet", "https://github.com/teovlt"]
          },
          {
            "@type": "ProfessionalService",
            "@id": "https://www.teovillet.fr/#business",
            "name": "Téo Villet — Développeur web freelance",
            "url": "https://www.teovillet.fr",
            "image": "https://www.teovillet.fr/og-image.jpg",
            "description": "Sites vitrines, applications et outils sur mesure pour restaurants, artisans et indépendants.",
            "founder": { "@id": "https://www.teovillet.fr/#person" },
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Grenoble",
              "addressRegion": "Auvergne-Rhône-Alpes",
              "addressCountry": "FR"
            },
            "areaServed": [
              { "@type": "City", "name": "Grenoble" },
              { "@type": "Country", "name": "France" }
            ],
            "knowsLanguage": ["fr", "en"]
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
