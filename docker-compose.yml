services:
  portfolio:
    build:
      context: .
      args:
        # Visitor stats (Plausible), off while empty. Read at build time
        VITE_PLAUSIBLE_DOMAIN: ${VITE_PLAUSIBLE_DOMAIN:-}
    # Traefik (Dokploy) owns ports 80/443 — attach the domain to this service on port 80
    expose:
      - "80"
    restart: always
    depends_on:
      - api

  api:
    build: ./server
    # Values come from the .env next to this file (Dokploy's "Environment" tab writes it)
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.teovillet.fr}
      PORT: 4000
      # Traefik + nginx sit in front of the API
      TRUST_PROXY: 2
      UPLOAD_DIR: /app/uploads
      # The site's index.html, which the API fills with each project's meta
      # tags for link previews (served by the portfolio container)
      SHELL_URL: http://portfolio/index.html
      # Formspree form that emails me when a review is submitted
      FORMSPREE_ENDPOINT: ${FORMSPREE_ENDPOINT:-https://formspree.io/f/mdkgvoeq}
    volumes:
      # Images uploaded from the dashboard must survive redeploys
      - uploads:/app/uploads
    restart: always

volumes:
  uploads:
