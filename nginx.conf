# Redirect non-www → www
server {
    listen 80;
    server_name teovillet.fr;
    return 301 $scheme://www.teovillet.fr$request_uri;
}

# Main server (www)
server {
    listen 80;
    server_name www.teovillet.fr;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend service
    # Resolved at request time via Docker's DNS, so nginx still boots (and
    # serves the site) when the api container is down or not yet started
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
