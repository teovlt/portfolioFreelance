# Redirect non-www → www
server {
    listen 80;
    server_name teovillet.fr;
    return 301 $scheme://www.teovillet.fr$request_uri;
}

# Main server (www)
server {
    listen 80;
    server_name www.teovillet.fr;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
