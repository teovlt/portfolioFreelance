# Redirect non-www → www
server {
    listen 80;
    server_name teovillet.fr;
    return 301 $scheme://www.teovillet.fr$request_uri;
}

# Main server (www)
# default_server: the API fetches index.html at http://portfolio/ (see
# SHELL_URL), a Host that neither server_name matches
server {
    listen 80 default_server;
    server_name www.teovillet.fr;

    root /usr/share/nginx/html;
    index index.html;

    # Nothing in front of nginx compresses responses: without this the JS
    # bundle goes out at full size. Also covers the proxied API's JSON.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Vite fingerprints JS/CSS/font filenames on every build, so they can be
    # cached forever
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images from public/ keep the same filename when replaced, so browsers
    # must recheck them
    location ~* \.(png|jpg|jpeg|gif|webp|ico|svg)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Proxy API requests to the backend service
    # ^~ stops nginx from also trying the regex locations above, otherwise
    # uploaded images (/api/uploads/*.jpg) would be looked up on disk here
    # Resolved at request time via Docker's DNS, so nginx still boots (and
    # serves the site) when the api container is down or not yet started
    location ^~ /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    # Built by the API from the projects in the database
    location = /sitemap.xml {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # Routes the React app knows (keep in sync with src/routes/router.tsx)
    location ~ ^/(mentions-legales|confidentialite)/?$ {
        try_files /index.html =404;
    }

    # Same index.html, filled in by the API with the page's own title,
    # description and image, and an HTML copy of its content, for link
    # previews and crawlers that don't run JavaScript.
    # Unknown projects get a real 404. If the API is down, the plain
    # index.html is served as before.
    location = / {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream/api/render/;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }
    location ~ ^/(projects/[^/]+|parcours)/?$ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream/api/render$request_uri;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }
    location @spa {
        try_files /index.html =404;
    }
    # Kept out of search results. A noindex header rather than a robots.txt
    # Disallow, which would stop crawlers from ever seeing the noindex
    location ~ ^/admin(/.*)?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    # Anything else is a real file or a real 404. The app is still served so
    # visitors get its "page not found" screen, but with the 404 status that
    # tells search engines not to index it
    location / {
        try_files $uri =404;
    }
    error_page 404 /index.html;
}
